<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RAVEN-RX Mountain Recovery</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#050607;color:#e8edf2;font-family:system-ui}#app{height:100%;display:grid;grid-template-columns:1fr 320px}#scene{position:relative;min-width:0}canvas{display:block;width:100%;height:100%}aside{background:#090b0e;border-left:1px solid #252a30;padding:18px;overflow:auto}.card{border:1px solid #252a30;background:#0d1014;border-radius:10px;padding:12px;margin:10px 0}.label{font-size:10px;color:#8f9aa5;text-transform:uppercase;letter-spacing:.1em}.value{font-size:16px;font-weight:700;margin-top:4px}.muted{color:#9aa5af;font-size:12px}button{width:100%;padding:11px;margin-top:8px;background:#151a20;border:1px solid #303741;color:#e8edf2;border-radius:8px;cursor:pointer}#banner{position:absolute;left:20px;top:20px;padding:12px 15px;background:#080a0dcc;border:1px solid #2c333b;border-radius:9px;max-width:520px}</style></head>
<body><div id="app"><div id="scene"><div id="banner"><b>RAVEN-RX · MOUNTAIN RECOVERY</b><div id="msg" class="muted">Ready. Start the scenario.</div></div></div>
<aside><h2>Mountain Recovery</h2><div class="muted">Standalone terrain preview — not yet integrated.</div>
<div class="card"><div class="label">Mission</div><div id="mission" class="value">READY</div></div>
<div class="card"><div class="label">Vehicle</div><div id="vehicle" class="value">AT START</div><div id="vd" class="muted">Route A</div></div>
<div class="card"><div class="label">Decision</div><div id="decision" class="value">ROUTE A</div><div id="dd" class="muted">Initial safest feasible route</div></div>
<div class="card"><div class="label">Recovery</div><div id="rec" class="value">0</div><div id="rd" class="muted">Backtracks</div></div>
<div class="card"><div class="label">Routes</div><div class="muted">A 18% initial · B 29% recovery · C 58% high risk</div></div>
<button id="start">Start 4–5 min demonstration</button><button id="jump">Jump to recovery</button><button id="reset">Reset</button></aside></div>
<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js";
import {OrbitControls} from "https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/controls/OrbitControls.js";
const root=document.getElementById("scene"),S=new THREE.Scene();S.background=new THREE.Color(0x07090b);S.fog=new THREE.Fog(0x07090b,90,260);
const C=new THREE.PerspectiveCamera(52,1,.1,500);C.position.set(28,28,48);const R=new THREE.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,1.6));R.shadowMap.enabled=true;root.appendChild(R.domElement);
const ctl=new OrbitControls(C,R.domElement);ctl.target.set(0,0,0);ctl.enableDamping=true;S.add(new THREE.HemisphereLight(0xc8d0d8,0x15181c,2.1));const sun=new THREE.DirectionalLight(0xffffff,3);sun.position.set(35,60,20);sun.castShadow=true;S.add(sun);
const g=new THREE.Mesh(new THREE.PlaneGeometry(220,220),new THREE.MeshStandardMaterial({color:0x252b28,roughness:1}));g.rotation.x=-Math.PI/2;g.receiveShadow=true;S.add(g);
for(let i=0;i<12;i++){let h=18+Math.random()*20,r=18+Math.random()*25,m=new THREE.Mesh(new THREE.ConeGeometry(r,h,7),new THREE.MeshStandardMaterial({color:0x303733,roughness:1}));m.position.set((Math.random()-.5)*150,h/2-2,(Math.random()-.5)*120);m.rotation.y=Math.random()*6.28;m.castShadow=m.receiveShadow=true;S.add(m)}
const tg=new THREE.ConeGeometry(1.3,5,7),tm=new THREE.MeshStandardMaterial({color:0x26352c}),trg=new THREE.CylinderGeometry(.22,.28,1.4,7),trm=new THREE.MeshStandardMaterial({color:0x43352b});
for(let i=0;i<90;i++){let x=(Math.random()-.5)*145,z=(Math.random()-.5)*115;if(Math.abs(x)<15&&z<45&&z>-70)continue;let t=new THREE.Group(),a=new THREE.Mesh(trg,trm),b=new THREE.Mesh(tg,tm);a.position.y=.7;b.position.y=3.2;t.add(a,b);t.position.set(x,0,z);t.scale.setScalar(.7+Math.random()*.7);t.traverse(o=>o.castShadow=true);S.add(t)}
function road(ps,w){let c=new THREE.CatmullRomCurve3(ps.map(p=>new THREE.Vector3(p.x,.2,p.z)));let m=new THREE.Mesh(new THREE.TubeGeometry(c,160,w/2,6,false),new THREE.MeshStandardMaterial({color:0x25282b,roughness:1}));m.receiveShadow=true;S.add(m);return c}
const A=road([[-42,58],[-30,35],[-20,12],[-13,-10],[-7,-28],[-5,-43],[-2,-57]].map(([x,z])=>({x,z})),5.2);
const B=road([[-13,-10],[2,-3],[15,5],[24,18],[32,35],[42,48]].map(([x,z])=>({x,z})),5.5);
const Cc=road([[-13,-10],[-1,3],[5,18],[5,36],[3,52],[0,65]].map(([x,z])=>({x,z})),5);
function marker(x,z,col){let m=new THREE.Mesh(new THREE.SphereGeometry(1.1,16,12),new THREE.MeshStandardMaterial({color:col,emissive:col,emissiveIntensity:.35}));m.position.set(x,1.3,z);S.add(m)}
marker(-42,58,0x7ed08b);marker(-13,-10,0x78b6ff);marker(42,48,0x7ed08b);
const gate=new THREE.Mesh(new THREE.BoxGeometry(8,2.8,.8),new THREE.MeshStandardMaterial({color:0x8e3438,emissive:0x361015}));gate.position.set(-4,1.4,-47);S.add(gate);
const truck=new THREE.Group(),body=new THREE.Mesh(new THREE.BoxGeometry(3.1,1.5,5.2),new THREE.MeshStandardMaterial({color:0xb5bdc4})),cab=new THREE.Mesh(new THREE.BoxGeometry(3,1.7,2),new THREE.MeshStandardMaterial({color:0x707a82}));body.position.y=2;cab.position.set(0,2.7,1.35);truck.add(body,cab);
for(const x of[-1.5,1.5])for(const z of[-1.65,1.65]){let w=new THREE.Mesh(new THREE.CylinderGeometry(.48,.48,.35,16),new THREE.MeshStandardMaterial({color:0x111214}));w.rotation.z=Math.PI/2;w.position.set(x,1.1,z);truck.add(w)}truck.traverse(o=>o.castShadow=true);S.add(truck);
const ui={m:document.getElementById("mission"),v:document.getElementById("vehicle"),vd:document.getElementById("vd"),d:document.getElementById("decision"),dd:document.getElementById("dd"),r:document.getElementById("rec"),rd:document.getElementById("rd"),msg:document.getElementById("msg")};
let running=false,t=0,paused=false;function place(curve,p,rev=false){p=Math.max(0,Math.min(1,p));let q=curve.getPointAt(p),a=curve.getPointAt(Math.max(0,Math.min(1,p+(rev?-0.01:.01))));truck.position.set(q.x,.4,q.z);truck.lookAt(a.x,.4,a.z)}
function reset(){running=false;t=0;place(A,0);ui.m.textContent="READY";ui.v.textContent="AT START";ui.vd.textContent="Route A";ui.d.textContent="ROUTE A";ui.dd.textContent="Initial safest feasible route";ui.r.textContent="0";ui.rd.textContent="Backtracks";ui.msg.textContent="Ready. Start the scenario."}
function tick(s){if(s<25){place(A,0);ui.m.textContent="INITIALIZING";ui.v.textContent="AT START";ui.msg.textContent="Terrain, routes and navigation constraints loaded."}
else if(s<95){place(A,(s-25)/70*.78);ui.m.textContent="MOVING";ui.v.textContent="TRAVELLING";ui.vd.textContent="Route A · 18% risk";ui.msg.textContent="Approaching the constrained mountain turn."}
else if(s<120){place(A,.78);ui.m.textContent="NAVIGATION EXCEPTION";ui.v.textContent="STOPPED";ui.vd.textContent="Forward turn infeasible";ui.d.textContent="ROUTE A · REJECTED";ui.dd.textContent="Turning radius exceeds available road geometry";ui.msg.textContent="RAVEN detects a physically infeasible continuation."}
else if(s<205){place(A,.78-(s-120)/85*.38,true);ui.m.textContent="RECOVERY";ui.v.textContent="BACKTRACKING";ui.vd.textContent="Returning to safe junction";ui.d.textContent="SAFE BACKTRACK";ui.dd.textContent="Recovery point identified";ui.r.textContent="1";ui.rd.textContent="Backtrack in progress";ui.msg.textContent="Vehicle reverses along the previously safe road."}
else if(s<225){place(A,.40);ui.m.textContent="REPLANNING";ui.v.textContent="AT SAFE JUNCTION";ui.vd.textContent="Decision point reached";ui.d.textContent="ROUTE B";ui.dd.textContent="29% risk · feasible";ui.msg.textContent="RAVEN evaluates alternatives from the recovery point."}
else if(s<280){place(B,(s-225)/55);ui.m.textContent="REROUTING";ui.v.textContent="TURNING";ui.vd.textContent="Entering Route B";ui.d.textContent="ROUTE B · ACTIVE";ui.dd.textContent="Selected after recovery";ui.msg.textContent="Vehicle physically transitions onto Route B."}
else{place(B,Math.min(1,(s-280)/40));ui.m.textContent="MISSION COMPLETE";ui.v.textContent="ARRIVED";ui.vd.textContent="Destination reached safely";ui.d.textContent="ROUTE B · FINAL";ui.dd.textContent="Recovery successful";ui.msg.textContent="Mission completed after safe backtracking and rerouting."}}
let last=performance.now();function loop(n){requestAnimationFrame(loop);let dt=(n-last)/1000;last=n;if(running&&!paused){t+=dt;tick(t)}ctl.update();R.render(S,C)}requestAnimationFrame(loop);function resize(){let w=root.clientWidth,h=root.clientHeight;C.aspect=w/h;C.updateProjectionMatrix();R.setSize(w,h,false)}addEventListener("resize",resize);resize();reset();
document.getElementById("start").onclick=()=>{running=true;t=0};document.getElementById("jump").onclick=()=>{running=true;t=95};document.getElementById("reset").onclick=reset;
</script></body></html>
